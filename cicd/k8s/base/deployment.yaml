apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  labels:
    app: demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # zero downtime: so remove o antigo apos o novo ficar Ready
  template:
    metadata:
      labels:
        app: demo-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Espalha as replicas entre nodes: um node cair nao derruba o servico
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: demo-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/mateusjacomine/demo-api:dev   # sobrescrito pelo overlay
          ports:
            - name: http
              containerPort: 8000
          env:
            # Sobrescrito por cada overlay com a tag real da imagem.
            # Nao usar fieldRef de label: labels com includeSelectors=false
            # nao chegam ao pod template e a variavel viria vazia.
            - name: APP_VERSION
              value: "dev"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi     # sem limit de CPU: evita throttling artificial
          # startupProbe protege o boot; enquanto ela nao passa, as outras
          # ficam suspensas. E a solucao para app de inicializacao lenta.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30      # ate 60s para subir
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          lifecycle:
            preStop:
              exec:
                # Da tempo do endpoint sair do balanceamento antes do SIGTERM
                command: ["/bin/sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 30
