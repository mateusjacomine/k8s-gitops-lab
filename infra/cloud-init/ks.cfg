#version=RHEL9
# Kickstart automatizado - Rocky Linux 9 - no k8s lab
# Instalacao 100% desatendida. Usuario: vagrant / senha: vagrant (lab isolado NAT)

text
skipx
eula --agreed
reboot --eject

# --- Idioma / teclado / fuso ---
lang en_US.UTF-8
keyboard --vckeymap=br-abnt2 --xlayouts='br'
timezone America/Sao_Paulo --utc

# --- Origem da instalacao (midia local) ---
cdrom

# --- Rede: DHCP; hostname vem por --hostname no boot ou default ---
network --bootproto=dhcp --device=link --activate --onboot=on --noipv6
network --hostname=k8s-node

# --- Autenticacao ---
rootpw --plaintext vagrant
user --name=vagrant --password=vagrant --plaintext --groups=wheel

# --- Seguranca: SELinux permissive facilita o lab sem mascarar o aprendizado ---
selinux --permissive
firewall --disabled

# --- Disco: usa o que existir. Sem ignoredisk: o Anaconda aborta se qualquer
# disco listado nao existir, e o nome varia (sda/nvme0n1/vda) conforme o
# controlador escolhido no VMware.
clearpart --all --initlabel
autopart --type=lvm --nohome

bootloader --location=mbr --append="crashkernel=no net.ifnames=0 biosdevname=0"

# --- Servicos ---
services --enabled=sshd,chronyd

%packages --ignoremissing --excludedocs
@^minimal-environment
openssh-server
chrony
tar
vim-minimal
bash-completion
iproute
iputils
bind-utils
tcpdump
nmap-ncat
socat
conntrack-tools
jq
sysstat
procps-ng
-plymouth
%end

%post --log=/root/ks-post.log
set -x

# sudo sem senha para o usuario do lab (necessario para automacao remota)
echo "vagrant ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/vagrant
chmod 440 /etc/sudoers.d/vagrant

# SSH: permitir senha (o lab e isolado em NAT); acelerar login
sed -i 's/^#\?PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config
sed -i 's/^#\?UseDNS .*/UseDNS no/' /etc/ssh/sshd_config
grep -q '^UseDNS' /etc/ssh/sshd_config || echo 'UseDNS no' >> /etc/ssh/sshd_config
systemctl enable sshd

# Marca que o kickstart concluiu (o orquestrador espera por este arquivo)
echo "ks-ok $(date -Is)" > /etc/ks-completed

%end
